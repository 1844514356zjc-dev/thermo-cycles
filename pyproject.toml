[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thermo-cycles"
version = "0.1.0"
description = "Real-fluid Brayton and Rankine cycles with exergy analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["CoolProp>=7,<9", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "flake8>=7,<8"]
plot = ["matplotlib>=3.7"]
ui = ["streamlit>=1.56,<2", "plotly>=5.18,<7"]
benchmark = ["iapws>=1.5.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]
