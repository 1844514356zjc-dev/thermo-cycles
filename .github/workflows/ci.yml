name: Scientific validation and deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements/docker.txt
            requirements/validation-constraints.txt
      - name: Install all test, UI, and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/validation-constraints.txt -e '.[dev,ui,benchmark]'
          python -m pip check
      - name: Check PEP 8 with Flake8
        run: python -m flake8 src tests benchmarks examples --count --show-source --statistics
      - name: Run thermodynamics and dashboard tests
        run: python -m pytest -ra --strict-config --strict-markers --junitxml=junit.xml
      - name: Compare independent reference cases
        shell: bash
        run: |
          python benchmarks/validate_literature.py | tee benchmark-results.md
          cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Container build and smoke test
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start healthy service
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check HTTP readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
      - name: Exercise real-fluid calculations inside the container
        run: |
          docker compose exec -T thermo-cycles python - <<'PY'
          from core.cycle_solver import (
              BraytonConfig, RankineConfig, solve_brayton, solve_rankine,
          )
          for function, config in (
              (solve_brayton, BraytonConfig()),
              (solve_rankine, RankineConfig()),
          ):
              result = function(config, points=20, include_saturation=False)
              assert 0.0 < result.thermal_efficiency < 1.0
              assert abs(result.energy_residual) < 1e-6
              assert abs(result.exergy_residual) < 1e-6
              print(config.fluid, result.thermal_efficiency)
          PY
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop service
        if: always()
        run: docker compose down --remove-orphans
